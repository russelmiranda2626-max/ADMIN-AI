<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KusinaAI Admin - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(145deg, #f97316, #ea580c 50%, #9a3412); padding: 1rem; }
        .card { background: #fff; width: 100%; max-width: 380px; border-radius: 24px; padding: 2rem; box-shadow: 0 30px 70px rgba(0,0,0,.3); }
        h1 { font-family: 'Fraunces', serif; font-size: 1.9rem; color: #1c1917; }
        h1 b { color: #ea580c; }
        .sub { color: #78716c; font-size: .9rem; margin: 4px 0 1.4rem; }
        label { display: block; font-size: .78rem; font-weight: 700; color: #44403c; margin-bottom: 5px; }
        input { width: 100%; padding: 12px 14px; border: 1.5px solid #ece7e2; border-radius: 12px; font-size: .95rem; outline: none; margin-bottom: 14px; }
        input:focus { border-color: #f97316; box-shadow: 0 0 0 4px rgba(249,115,22,.14); }
        button { width: 100%; padding: 13px; border: none; border-radius: 12px; background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; }
        button:disabled { opacity: .7; cursor: wait; }
        .err { display: none; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 10px 14px; border-radius: 12px; font-size: .85rem; font-weight: 600; margin-bottom: 14px; }
        .err.show { display: block; }
        .pw { position: relative; }
        .pw input { padding-right: 78px; }
        .eye { position: absolute; right: 8px; top: 7px; width: auto; padding: 6px 10px; border-radius: 9px; background: #ffedd5; color: #ea580c; font-size: .75rem; font-weight: 800; }
        .lang-switch { position: fixed; top: 18px; right: 18px; display: flex; background: #fff; border: 1.5px solid #fed7aa; border-radius: 30px; padding: 3px; }
        .lang-switch button { width: auto; padding: 6px 13px; border: none; border-radius: 30px; background: transparent; color: #78716c; font-size: .78rem; font-weight: 800; cursor: pointer; }
        .lang-switch button.active { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; }
    </style>
</head>
<body>
    <div class="lang-switch">
        <button id="lang-tl" onclick="setLang('tl')">TL</button>
        <button id="lang-en" onclick="setLang('en')">EN</button>
    </div>
    <form class="card" onsubmit="go(event)">
        <h1>Kusina<b>AI</b> Admin</h1>
        <p class="sub" data-i18n="sub"></p>
        <div class="err" id="err"></div>
        <label for="u" data-i18n="user"></label>
        <input id="u" autocomplete="username" required>
        <label for="p">Password</label>
        <div class="pw"><input id="p" type="password" autocomplete="current-password" required>
            <button type="button" id="eye" class="eye" onclick="togglePw()" data-i18n="show"></button></div>
        <button id="b" data-i18n="btn"></button>
    </form>
    <script>
        const I18N = {
            tl: { sub: 'Para lang sa may-ari ng site.', noconf: 'Ilagay muna ang ADMIN_PASSWORD sa .env bago mag-login.', user: 'Username', btn: 'Mag-login', show: 'Ipakita', hide: 'Itago', conn: 'Walang koneksyon sa server.', gen: 'May error.', lock: 'Masyadong maraming maling subok. Maghintay ng 5 minuto.', bad: 'Maling username o password.' },
            en: { sub: 'For the site owner only.', noconf: 'Set ADMIN_PASSWORD in .env before logging in.', user: 'Username', btn: 'Log in', show: 'Show', hide: 'Hide', conn: 'Could not reach the server.', gen: 'Something went wrong.', lock: 'Too many failed attempts. Wait 5 minutes.', bad: 'Wrong username or password.' }
        };
        let lang = 'tl';
        try { lang = localStorage.getItem('kusina_lang') === 'en' ? 'en' : 'tl'; } catch (e) {}
        const t = k => I18N[lang][k];
        function applyLang() {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.getElementById('lang-tl').classList.toggle('active', lang === 'tl');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
        }
        function setLang(l) { lang = l; try { localStorage.setItem('kusina_lang', l); } catch (e) {} applyLang(); }
        function togglePw() {
            const i = document.getElementById('p'), show = i.type === 'password';
            i.type = show ? 'text' : 'password';
            document.getElementById('eye').textContent = t(show ? 'hide' : 'show');
        }
        const _apply = applyLang;
        applyLang = function () { _apply(); document.getElementById('eye').textContent = t(document.getElementById('p').type === 'password' ? 'show' : 'hide'); };
        applyLang();
        (function () {
            const e = new URLSearchParams(location.search).get('err');
            if (!e) return;
            const el = document.getElementById('err');
            el.textContent = e === 'lock' ? t('lock') : t('bad'); el.classList.add('show');
        })();

        async function go(e) {
            e.preventDefault();
            const b = document.getElementById('b'), err = document.getElementById('err');
            b.disabled = true; err.classList.remove('show');
            try {
                const r = await fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) });
                const d = await r.json();
                if (d.ok) { location.href = '/admin'; return; }
                err.textContent = d.error || t('gen'); err.classList.add('show');
            } catch (x) { err.textContent = t('conn'); err.classList.add('show'); }
            b.disabled = false;
        }
    </script>
</body>
</html>
